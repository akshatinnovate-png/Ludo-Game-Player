<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121620">
  <title>Ludo Table</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23fff%22/%3E%3Crect x=%228%22 y=%228%22 width=%2238%22 height=%2238%22 rx=%226%22 fill=%22%23e53935%22/%3E%3Crect x=%2254%22 y=%228%22 width=%2238%22 height=%2238%22 rx=%226%22 fill=%22%232fa84f%22/%3E%3Crect x=%2254%22 y=%2254%22 width=%2238%22 height=%2238%22 rx=%226%22 fill=%22%23f5bd12%22/%3E%3Crect x=%228%22 y=%2254%22 width=%2238%22 height=%2238%22 rx=%226%22 fill=%22%231e7be5%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="table">
    <div class="board-wrap">
      <canvas id="board" aria-label="Ludo board"></canvas>
    </div>

    <aside class="panel">
      <header class="brand">
        <h1>Ludo<span>Table</span></h1>
        <div class="tools">
          <button id="btn-sound" class="ghost" title="Sound on/off">🔊</button>
          <button id="btn-new" class="ghost">New game</button>
        </div>
      </header>

      <div id="turn" class="turn"></div>

      <div class="dice-area">
        <button id="dice-btn" class="dice-tray" aria-label="Roll the dice">
          <div class="dice-scene"><div id="cube" class="cube"></div></div>
        </button>
        <p id="hint" class="hint">Click the dice or press Space</p>
        <div id="dice-chips" class="dice-chips"></div>
      </div>

      <ul id="players" class="players"></ul>

      <div class="log-wrap">
        <h2>Game log</h2>
        <ol id="log" class="log"></ol>
      </div>
    </aside>
  </div>

  <div id="toast" class="toast" hidden></div>

  <dialog id="setup">
    <form method="dialog" class="setup">
      <h2>New game</h2>
      <p class="muted">Opposite colours are partners and share every throw: a throw for either colour can move either colour's pawns. Click a colour to switch it between Human and Computer.</p>
      <div id="seat-grid" class="seat-grid"></div>
      <label class="row-label">Computer speed
        <select id="opt-speed">
          <option value="1.6">Relaxed</option>
          <option value="1" selected>Normal</option>
          <option value="0.5">Fast</option>
        </select>
      </label>
      <div class="setup-actions">
        <button value="cancel" id="btn-setup-cancel" class="ghost">Cancel</button>
        <button value="ok" class="primary">Play</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
